# The build on every push: the workspace builds and the fast tier, `cargo test -q`, passes on
# Windows without clang on the PATH. The slow tier (the oracles behind the `oracle` feature)
# runs in nightly.yml. A later push to the same branch cancels a run still going on the older
# one, so the queue never holds more than the newest state.
name: build

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # a run on main finishes: the walks land a card every few minutes and a cancelled run never
  # said whether main was green (2026-11-15); the newest push waits, the ones between are dropped
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  windows:
    name: build and test (windows)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # the machine swaps on a full-parallel build; the runner is smaller than the machine
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          # the version is the tree's commit count: the whole history, not a shallow one
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-build

      - name: format
        run: cargo fmt --all -- --check

      - name: build
        run: cargo build --workspace --locked

      # the fast tier: every test target the default features build, and no tool but cargo
      - name: test
        run: cargo test -q --workspace --locked --no-fail-fast

      # the lint reports and does not fail the build
      - name: clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked

      - name: binary
        uses: actions/upload-artifact@v4
        with:
          name: rhipper-asm-debug-windows
          path: target/debug/ras.exe
          retention-days: 7
