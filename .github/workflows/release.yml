# The release of ras: on a tag v<version>, test on Windows and Linux, build the release binary for
# each host, pack it with its runtime files, and publish version.txt and ras-<version>-<host>.zip
# with its .sha256 for windows-x64, linux-x64, macos-x64 and macos-arm64, which the Rhipper
# Workbench downloads into its tools directory, and ras-signatures-<version>.zip, the signature
# store of the MSVC runtime the Windows runner has. Nightly, and on a dispatch, the smoke corpus
# instead: `ras smoke` over the runner's Windows system directory.
name: release

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # every executable and library of the system directory through the analysis, the lift and the
  # emit; the job fails on a panic or a crash, and the report is kept either way
  smoke:
    if: github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        # the backtraces of the report need the line tables the release binary strips
        run: cargo build --release -p ras
        env:
          CARGO_PROFILE_RELEASE_STRIP: "false"
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
      - name: Smoke
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & target/release/ras.exe smoke "$env:SystemRoot\System32" --depth 0 --timeout 120 --jobs 4 --quiet --out dist/smoke.json | Tee-Object dist/smoke.txt
          exit $LASTEXITCODE
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: dist/smoke.*

  test:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install LLVM
        run: choco install llvm --no-progress -y
      - name: Test
        run: cargo test --workspace --no-fail-fast
        env:
          CARGO_BUILD_JOBS: "4"

  # On Linux the lift, the IR gate, the interpreter and the emit run over the Windows fixtures, and
  # the Linux fixture's port builds with the host's clang and runs, and so do the rhtest `core` and
  # `calls` ports over the runtime's Win32 layer; the other Windows programs' ports build and run
  # on the Windows job alone.
  test-linux:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install LLVM
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - name: Test
        run: cargo test --workspace --no-fail-fast
        env:
          CARGO_BUILD_JOBS: "4"

  # the fuzz targets of fuzz/ build against the released loaders and decoders; the nightly fuzz
  # workflow runs them
  fuzz-targets:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Build
        run: cargo fuzz build

  build:
    needs: [test, test-linux, fuzz-targets]
    strategy:
      matrix:
        include:
          - host: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            exe: ras.exe
            native: true
          - host: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: ras
            native: true
          # the Intel build is cross-compiled on the ARM runner, which cannot run it
          - host: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
            exe: ras
            native: false
          - host: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            exe: ras
            native: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release -p ras --target ${{ matrix.target }}
      - name: Pack
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("${{ github.ref_name }}" -ne "v$version" -and "${{ github.event_name }}" -eq "push") {
            throw "the tag ${{ github.ref_name }} does not match the workspace version $version"
          }
          $exe = "target/${{ matrix.target }}/release/${{ matrix.exe }}"
          # The workbench shows this line under Tools: the binary must answer with the released version.
          if ("${{ matrix.native }}" -eq "true") {
            $reported = (& $exe --version | Out-String).Trim()
            if ($reported -ne "ras $version") {
              throw "ras --version printed '$reported', expected 'ras $version'"
            }
          }
          New-Item -ItemType Directory -Force dist/ras | Out-Null
          Copy-Item $exe dist/ras/
          Copy-Item -Recurse runtime dist/ras/runtime
          Copy-Item README.md dist/ras/
          $name = "ras-$version-${{ matrix.host }}.zip"
          # Compress-Archive drops the executable bit; zip keeps it for the hosts that read it.
          if ($IsWindows) {
            Compress-Archive -Path dist/ras/* -DestinationPath "dist/$name"
          } else {
            Push-Location dist/ras
            zip -q -r "../$name" .
            if ($LASTEXITCODE -ne 0) { throw "zip failed for $name" }
            Pop-Location
          }
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Out-File -Encoding ascii "dist/$name.sha256"
          Remove-Item -Recurse dist/ras
      - uses: actions/upload-artifact@v4
        with:
          name: ras-${{ matrix.host }}
          path: dist/

  # The signature store of the runner's MSVC static runtime (x86, x64, arm64, with the Windows
  # SDK's ucrt), for the people without that toolset: ras-signatures-<version>.zip holds
  # <toolset>/<machine>/<library>.sig, unpacked into ~/.rhipper/signatures as it is.
  signatures:
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p ras
      - name: Store
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          & target/release/ras.exe signatures --build --installed --store dist/signatures
          if ($LASTEXITCODE -ne 0) { throw "ras signatures --build failed" }
          $name = "ras-signatures-$version.zip"
          Compress-Archive -Path dist/signatures/* -DestinationPath "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Out-File -Encoding ascii "dist/$name.sha256"
          Remove-Item -Recurse dist/signatures
      - uses: actions/upload-artifact@v4
        with:
          name: ras-signatures
          path: dist/

  publish:
    needs: [build, signatures]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Version
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          printf '%s' "$version" > dist/version.txt
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: ras ${{ env.VERSION }}
          # the notes: what changed since the last release, from the commits, written by GitHub,
          # after a line to the machine coverage report that pages.yml keeps current
          body: "Machine coverage: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/version.txt
            dist/ras-${{ env.VERSION }}-windows-x64.zip
            dist/ras-${{ env.VERSION }}-windows-x64.zip.sha256
            dist/ras-${{ env.VERSION }}-linux-x64.zip
            dist/ras-${{ env.VERSION }}-linux-x64.zip.sha256
            dist/ras-${{ env.VERSION }}-macos-x64.zip
            dist/ras-${{ env.VERSION }}-macos-x64.zip.sha256
            dist/ras-${{ env.VERSION }}-macos-arm64.zip
            dist/ras-${{ env.VERSION }}-macos-arm64.zip.sha256
            dist/ras-signatures-${{ env.VERSION }}.zip
            dist/ras-signatures-${{ env.VERSION }}.zip.sha256
