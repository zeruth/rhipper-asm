# The release of ras: on a tag v<version>, build the release binary for Windows x64, pack it with
# its runtime files, and publish version.txt, ras-<version>-windows-x64.zip and its .sha256, which
# the Rhipper Workbench downloads into its tools directory. Nightly, and on a dispatch, the smoke
# corpus instead: `ras smoke` over the runner's Windows system directory.
name: release

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # every executable and library of the system directory through the analysis, the lift and the
  # emit; the job fails on a panic or a crash, and the report is kept either way
  smoke:
    if: github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        # the backtraces of the report need the line tables the release binary strips
        run: cargo build --release -p ras
        env:
          CARGO_PROFILE_RELEASE_STRIP: "false"
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
      - name: Smoke
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & target/release/ras.exe smoke "$env:SystemRoot\System32" --depth 0 --timeout 120 --jobs 4 --quiet --out dist/smoke.json | Tee-Object dist/smoke.txt
          exit $LASTEXITCODE
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: dist/smoke.*

  test:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install LLVM
        run: choco install llvm --no-progress -y
      - name: Test
        run: cargo test --workspace --no-fail-fast
        env:
          CARGO_BUILD_JOBS: "4"

  # the fuzz targets of fuzz/ build against the released loaders and decoders; the nightly fuzz
  # workflow runs them
  fuzz-targets:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Build
        run: cargo fuzz build

  release:
    needs: [test, fuzz-targets]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p ras
      - name: Pack
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("${{ github.ref_name }}" -ne "v$version" -and "${{ github.event_name }}" -eq "push") {
            throw "the tag ${{ github.ref_name }} does not match the workspace version $version"
          }
          # The workbench shows this line under Tools: the binary must answer with the released version.
          $reported = (& target/release/ras.exe --version | Out-String).Trim()
          if ($reported -ne "ras $version") {
            throw "ras --version printed '$reported', expected 'ras $version'"
          }
          New-Item -ItemType Directory -Force dist/ras | Out-Null
          Copy-Item target/release/ras.exe dist/ras/
          Copy-Item -Recurse runtime dist/ras/runtime
          Copy-Item README.md dist/ras/
          $zip = "dist/ras-$version-windows-x64.zip"
          Compress-Archive -Path dist/ras/* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ras-$version-windows-x64.zip" | Out-File -Encoding ascii "$zip.sha256"
          $version | Out-File -Encoding ascii -NoNewline dist/version.txt
          "VERSION=$version" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: ras ${{ env.VERSION }}
          # the notes: what changed since the last release, from the commits, written by GitHub
          generate_release_notes: true
          files: |
            dist/version.txt
            dist/ras-${{ env.VERSION }}-windows-x64.zip
            dist/ras-${{ env.VERSION }}-windows-x64.zip.sha256
