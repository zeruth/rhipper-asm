[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "AGPL-3.0-or-later"

[workspace.dependencies]
ra-asm-format = { path = "crates/ra-asm-format" }
ra-asm-arch = { path = "crates/ra-asm-arch" }
ra-asm-pe = { path = "crates/ra-asm-pe" }
ra-asm-ir = { path = "crates/ra-asm-ir" }
ra-asm-x86 = { path = "crates/ra-asm-x86" }
ra-asm-arm64 = { path = "crates/ra-asm-arm64" }
ra-asm-analysis = { path = "crates/ra-asm-analysis" }
ra-asm-lift = { path = "crates/ra-asm-lift" }
ra-asm-emit = { path = "crates/ra-asm-emit" }
ra-asm-testing = { path = "crates/ra-asm-testing" }
ra-asm-wasm = { path = "crates/ra-asm-wasm" }

anyhow = "1.0.100"
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2"

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# A binary parser casts widths on every line; the field names say what the value is.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
implicit_hasher = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
# The release binary is what the workbench downloads; symbols only add to the download.
strip = true

[profile.dev.package."*"]
opt-level = 2
