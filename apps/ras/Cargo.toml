[package]
name = "ras"
description = "Rhipper Asm: disassemble a PE image to the Rhipper IR"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "ras"
path = "src/main.rs"

[features]
# The slow tier: the pipeline test builds and runs ports with clang (its fixtures module is behind
# the feature; the large program's ignored run is not), the smoke test walks System32.
oracle = []

[[test]]
name = "smoke"
required-features = ["oracle"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
# The allocator: the passes allocate from every thread at once, and the system heap serializes them.
mimalloc = { version = "0.1", default-features = false }
ra-asm-analysis.workspace = true
ra-asm-arch.workspace = true
ra-asm-emit.workspace = true
ra-asm-format.workspace = true
ra-asm-host.workspace = true
ra-asm-ir.workspace = true
ra-asm-jvm.workspace = true
ra-asm-riscv.workspace = true
ra-asm-ppc.workspace = true
ra-asm-msp430.workspace = true
ra-asm-sh.workspace = true
ra-asm-lift.workspace = true
ra-asm-pe.workspace = true
ra-asm-verify.workspace = true
ra-asm-wasm.workspace = true
ra-asm-x86.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
ra-asm-testing.workspace = true
