[package]
name = "ra-asm-lift"
description = "Instructions to machine IR, and the raising passes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# The slow tier: the oracle lifts every fixture at each level, compiles the IR with clang and runs it.
# The `oracle` test target builds without it: its instruction oracles need no tool.
oracle = []

# The native x86 instruction oracle (Windows, two minutes): the vector files it writes replay in
# `vectors` on any host in the fast tier.
[[test]]
name = "instruction_oracle"
required-features = ["oracle"]

[[test]]
name = "mips_data"
path = "tests/mips_data.rs"

[dependencies]
anyhow.workspace = true
ra-asm-analysis.workspace = true
ra-asm-arch.workspace = true
ra-asm-arm64.workspace = true
ra-asm-ir.workspace = true
ra-asm-pe.workspace = true
ra-asm-protos.workspace = true
ra-asm-x86.workspace = true

[dev-dependencies]
ra-asm-testing.workspace = true
