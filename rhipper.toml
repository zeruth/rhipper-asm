# What a Rhipper Agent worker may run in this project beyond the agent's own allowlist, and the
# environment every run gets. The ports and traces of a program are built by hand with clang and
# read with the LLVM tools (see rhipper.context.md), and the engine's own binary runs the steps.
[worker]
# A run restarts in a fresh session after this many turns, with its handoff carried over: the
# context a turn carries here grew to 300k tokens over a 200-turn run, and that is the cost.
turns = 40
allow = [
    "clang",
    "clang++",
    "clang-cl",
    "lld-link",
    "llvm-objdump",
    "llvm-readobj",
    "llvm-symbolizer",
    "llvm-nm",
    "cmake",
    "ninja",
    "target/debug/ras.exe",
    "target\\debug\\ras.exe",
    ".\\target\\debug\\ras.exe",
    "./target/debug/ras.exe",
    # the reference programs' build script, and the built programs themselves
    "testdata/build.ps1",
    "./testdata/build.ps1",
    ".\\testdata\\build.ps1",
    "Bash(./testdata/bin/*)",
    "PowerShell(.\\testdata\\bin\\*)",
    "Bash(out/*)",
    "Bash(./out/*)",
    "PowerShell(./out/*)",
    "PowerShell(.\\out\\*)",
]

[worker.env]
# The machine swaps on a full-parallel build.
CARGO_BUILD_JOBS = "6"
