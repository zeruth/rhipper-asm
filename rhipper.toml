# What a Rhipper Agent worker may run in this project beyond the agent's own allowlist, and the
# environment every run gets. The ports and traces of a program are built by hand with clang and
# read with the LLVM tools (see rhipper.context.md), and the engine's own binary runs the steps.
[worker]
# The directories the tests make under %TEMP%: a landing sweeps their entries older than an
# hour, and `rc doctor` reports what they hold (58 GB had piled up by 2026-11-12; card #138
# makes the tests clean up themselves).
temp = ["ra-asm-emit-tests", "ra-asm-lift-tests", "ras-pipeline-tests"]
# Opus since 2026-11-12 (the person: "switch rhipper asm to opus"): six writers at once, one
# card each in its worktree, none of them building; the orchestrator's check builds on the
# machine's four build slots. A turn's cost scales with the context it carries, so a run
# restarts fresh on a handoff once a turn passes this many input tokens. No turn cap. The
# walk borrows the pool's spare slots: once runelite's queue is empty, asm has all twelve.
context = 160000
parallel = 6
builds = 0
# The emit oracle suite builds and runs every reference program: a card's check gets half an
# hour here, not the ten minutes of the default.
check_timeout = 1800
allow = [
    "clang",
    "clang++",
    "clang-cl",
    "lld-link",
    "llvm-objdump",
    "llvm-readobj",
    "llvm-symbolizer",
    "llvm-nm",
    "cmake",
    "ninja",
    "target/debug/ras.exe",
    "target\\debug\\ras.exe",
    ".\\target\\debug\\ras.exe",
    "./target/debug/ras.exe",
    # the reference programs' build script, and the built programs themselves
    "testdata/build.ps1",
    "./testdata/build.ps1",
    ".\\testdata\\build.ps1",
    "Bash(./testdata/bin/*)",
    "PowerShell(.\\testdata\\bin\\*)",
    "Bash(out/*)",
    "Bash(./out/*)",
    "PowerShell(./out/*)",
    "PowerShell(.\\out\\*)",
]

[worker.env]
# The machine swaps on a full-parallel build.
CARGO_BUILD_JOBS = "6"

# The implementer of every card here is Opus; the reviewer and the cheap roles keep theirs.
[[route]]
model = "claude-opus-5-5"
