# What a Rhipper Agent worker may run in this project beyond the agent's own allowlist, and the
# environment every run gets. The ports and traces of a program are built by hand with clang and
# read with the LLVM tools (see rhipper.context.md), and the engine's own binary runs the steps.
[worker]
# The directories the tests make under %TEMP%: a landing sweeps their entries older than an
# hour, and `rc doctor` reports what they hold (58 GB had piled up by 2026-11-12; card #138
# makes the tests clean up themselves).
temp = ["ra-asm-emit-tests", "ra-asm-lift-tests", "ras-pipeline-tests"]
# Opus since 2026-11-12 (the person: "switch rhipper asm to opus"): six writers at once, one
# card each in its worktree, none of them building; the orchestrator's check builds on the
# machine's four build slots. A turn's cost scales with the context it carries, so a run
# restarts fresh on a handoff once a turn passes this many input tokens. No turn cap. The
# walk borrows the pool's spare slots: once runelite's queue is empty, asm has all twelve.
context = 160000
# One Fable worker since the new week (the person, 2026-11-12): the roadmap is pruned and
# regenerated around the WSL console toolchains and the other architectures, then walked one
# card at a time, outside the Opus pool.
parallel = 1
builds = 0
# The emit oracle suite builds and runs every reference program: a card's check gets half an
# hour here, not the ten minutes of the default.
check_timeout = 1800
allow = [
    "clang",
    "clang++",
    "clang-cl",
    "lld-link",
    "llvm-objdump",
    "llvm-readobj",
    "llvm-symbolizer",
    "llvm-nm",
    "cmake",
    "ninja",
    "target/debug/ras.exe",
    "target\\debug\\ras.exe",
    ".\\target\\debug\\ras.exe",
    "./target/debug/ras.exe",
    # the reference programs' build script, and the built programs themselves
    "testdata/build.ps1",
    "./testdata/build.ps1",
    ".\\testdata\\build.ps1",
    "Bash(./testdata/bin/*)",
    "PowerShell(.\\testdata\\bin\\*)",
    "Bash(out/*)",
    "Bash(./out/*)",
    "PowerShell(./out/*)",
    "PowerShell(.\\out\\*)",
    # reading the environment (a toolchain's root such as KOS_BASE, card #93) and listing the
    # system directory's executables (the smoke corpus, card #132): both read-only
    # packing the reference programs into the packed fixtures (card #53)
    "upx",
    "C:\\Users\\tyler\\AppData\\Local\\Microsoft\\WinGet\\Packages\\UPX.UPX_Microsoft.Winget.Source_8wekyb3d8bbwe\\upx-5.3.0-win64\\upx.exe",
    "PowerShell(& C:\\Users\\tyler\\AppData\\Local\\Microsoft\\WinGet\\Packages\\UPX.UPX_Microsoft.Winget.Source_8wekyb3d8bbwe\\upx-5.3.0-win64\\upx.exe *)",
    # the console toolchains live in WSL Ubuntu 24.04 (see rhipper.context.md): a login shell
    # there has every SDK on its path
    "wsl",
    "Bash(wsl *)",
    "PowerShell(wsl *)",
    "printenv",
    "Bash(printenv *)",
    "PowerShell(Get-ChildItem C:\\Windows\\System32*)",
    "Bash(ls /c/Windows/System32*)",
    # the roadmap commands a regeneration card reshapes the roadmap with; in a worktree `rc`
    # opens the project's roadmap. Not `rc set` (accepted lands a card) nor the walk's commands
    "Bash(rc show*)",
    "Bash(rc check*)",
    "Bash(rc next*)",
    "Bash(rc history*)",
    "Bash(rc add *)",
    "Bash(rc edit *)",
    "Bash(rc remove *)",
    "Bash(rc move *)",
    "Bash(rc depend *)",
    "Bash(rc priority *)",
    "PowerShell(rc show*)",
    "PowerShell(rc check*)",
    "PowerShell(rc next*)",
    "PowerShell(rc history*)",
    "PowerShell(rc add *)",
    "PowerShell(rc edit *)",
    "PowerShell(rc remove *)",
    "PowerShell(rc move *)",
    "PowerShell(rc depend *)",
    "PowerShell(rc priority *)",
    "Bash(rc set * defined)",
    "Bash(rc set * blocked)",
    "Bash(rc set * cancelled)",
    "PowerShell(rc set * defined)",
    "PowerShell(rc set * blocked)",
    "PowerShell(rc set * cancelled)",
]

[worker.env]
# The machine swaps on a full-parallel build.
CARGO_BUILD_JOBS = "6"

# The whole week is spent, not stopped at 90% (the person, 2026-11-12: "use what is available").
[plan]
threshold = 1.0

# The implementer of every card here is Fable; the reviewer and the cheap roles keep theirs.
[[route]]
model = "claude-fable-5-2"
