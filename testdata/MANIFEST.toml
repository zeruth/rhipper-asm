# The record of the committed fixtures: how each binary, vector file and expected output was made
# and what it rests on. `cargo test -p ra-asm-testing --test manifest` hashes the tree and fails
# on a file that is not listed here, a wrong hash, a missing file or a missing expected output.
#
# Listed is everything under testdata/bin and testdata/expected, everything under testdata/rhtest
# but its sources and its build script, and the .vec and .cases files under testdata/vectors.
# Sources, scripts, templates and PENDING.txt lists are text a review reads, and are not listed.
#
# Each [[file]] is one file. `path`, `sha256` and `evidence` are required; `evidence` is
#   native    the program ran on this machine (a vector file: its processor executed the cases),
#   emulator  it ran in an emulator of its machine (the one `tools` names),
#   source    nothing ran it: an output is derived from the source and the platform's
#             documentation, a binary is only read, lifted and interpreted, a case file is assembled.
# `expected` is the output a program is compared with, `source` what the file was made from,
# `command` what made it and `tools` the versions the command ran with. `checker` is the highest
# raise level (machine, promoted, abi) whose checker the lift of a binary must pass, with every
# level below it; a file without it is held to none, and `manifest::checked_fixtures(level)` is
# the set a level's test walks. Paths are relative to the
# workspace root. `sha256` is of the bytes git stores: a text file checked out with CRLF is
# hashed with its line endings as LF. The test prints the hash of a file it finds wrong or
# unlisted, so an entry is written by hand from its failure.
#
# The versions are those on the machine when the manifest was written (2026-11-14). /Brepro makes
# a rebuild byte-identical for the same LLVM: hello64.exe was rebuilt with clang 22.1.7 and
# matched; the other clang fixtures are recorded with the same toolchain without a rebuild. Where
# no script holds the command and it was not kept, `command` says so rather than guess.
#
# A `source` entry's expected output is replaced by an emulator's once one is on the machine: for
# the PlayStation fixtures a run under an emulator with TTY logging (DuckStation's or PCSX-Redux's
# console output is the BIOS's printf), the entry's `evidence` turning `emulator` and `tools`
# naming the emulator and its version.

