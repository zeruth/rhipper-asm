# The record of the committed fixtures: how each binary was made and what its expected output
# rests on. `cargo test -p ra-asm-testing --test manifest` hashes every listed file and fails on
# a wrong hash, a missing file or a missing expected output.
#
# Each [[file]] is one binary. `path`, `sha256` and `evidence` are required; `evidence` is
#   native    the program ran on this machine,
#   emulator  it ran in an emulator of its machine (the one `tools` names),
#   source    nothing ran it: the output is derived from the source and the platform's documentation.
# `expected` is the output it is compared with, `source` what it was built from, `command` what
# made it and `tools` the versions the command ran with. Paths are relative to the workspace root.
#
# Only the fixtures of the foreign machines are listed so far; the Windows fixtures of build.ps1
# and the rhtest programs join as their own entries.
#
# A `source` entry's expected output is replaced by an emulator's once one is on the machine: for
# the PlayStation fixtures a run under an emulator with TTY logging (DuckStation's or PCSX-Redux's
# console output is the BIOS's printf), the entry's `evidence` turning `emulator` and `tools`
# naming the emulator and its version.

[[file]]
path = "testdata/bin/hello_mipsel"
sha256 = "21a20edea3576fc8b8cc78bc3ca5247bf5fd583c6cc8c94967fc3216638dc395"
evidence = "emulator"
expected = "testdata/expected/hello.txt"
source = "testdata/src/hello.c"
command = "testdata/src/freestanding/build.sh mipsel"
tools = "Ubuntu clang 18.1.3, Ubuntu LLD 18.1.3, qemu-mipsel 8.2.2 (WSL Ubuntu 24.04)"

[[file]]
path = "testdata/bin/control_mipsel"
sha256 = "e27d64dd4706547bc59925d6de71d33afa9c3d1157da3b54cd14407e8a11e3e8"
evidence = "emulator"
expected = "testdata/expected/control.txt"
source = "testdata/src/control.c"
command = "testdata/src/freestanding/build.sh mipsel"
tools = "Ubuntu clang 18.1.3, Ubuntu LLD 18.1.3, qemu-mipsel 8.2.2 (WSL Ubuntu 24.04)"

# The PlayStation fixtures: PS-EXEs built with PSn00bSDK, the output through the BIOS's printf.
# hello_psx.txt is what the one printf of the source formats; gte_psx.txt is the GTE's documented
# arithmetic (psx-spx: RTPS, RTPT, NCLIP, AVSZ3 and the FLAG register) over the inputs the source
# chose so that every step is exact.
[[file]]
path = "testdata/bin/hello_psx.exe"
sha256 = "799917cdcd9a512eb26cd01fdbd24d5d3dea9e6d19cbed482833278199c91291"
evidence = "source"
expected = "testdata/expected/hello_psx.txt"
source = "testdata/src/psx/hello.c"
command = "testdata/src/psx/build.sh"
tools = "PSn00bSDK 0.24, mipsel-none-elf-gcc 12.3.0, elf2x (WSL Ubuntu 24.04)"

[[file]]
path = "testdata/bin/gte_psx.exe"
sha256 = "8fe8339030e450681b9d1b538aed3a9b13a23bfe741f4f529823c94f96b86110"
evidence = "source"
expected = "testdata/expected/gte_psx.txt"
source = "testdata/src/psx/gte.c"
command = "testdata/src/psx/build.sh"
tools = "PSn00bSDK 0.24, mipsel-none-elf-gcc 12.3.0, elf2x (WSL Ubuntu 24.04)"
